services:
  youtube-tv:
    image: ghcr.io/craftyplayz/youtube-tv:latest
    ports:
      - "${WEB_PORT:-2345}:8080"
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - youtube-tv-data:/data
    restart: unless-stopped

volumes:
  youtube-tv-data:
